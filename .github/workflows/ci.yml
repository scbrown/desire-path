name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A listed hook is not proof it executes: require both a benign control
      # and synthetic private-key refusals before scanning the tracked tree.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install private-key scanner
        run: python3 -m pip install pre-commit==4.6.1
      - name: Private-key refusal controls and tracked-file scan
        run: python3 scripts/check-private-keys.py

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: go test -tags integration ./internal/integration/
