name: Release

# Releases come from a merged release-please PR, not a hand-pushed tag (aegis-ebal6v.7.2):
# the same model as bobbin, quipu, seeds and yupana.
#
# release-please creates the tag and a DRAFT release with GITHUB_TOKEN, and GitHub does
# not re-trigger workflows from a token-authored tag push. So goreleaser runs in THIS run,
# gated on release_created, instead of on a tag trigger that cannot fire. The tag-push and
# workflow_dispatch arms remain as the manual fallback.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to (re)publish, e.g. v0.4.1"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    # always(): release-please is SKIPPED on the tag-push and dispatch arms, and a plain
    # `needs` would skip this job with it.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || needs.release-please.outputs.tag_name }}
    steps:
      # Check out the release TAG, not the trigger ref: on the merge path the trigger is
      # main, and goreleaser must build exactly the tagged commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
